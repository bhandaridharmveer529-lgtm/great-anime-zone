<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great.Anime Zone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #07090e; color: #fff; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
.app-shell { width: 100%; max-width: 480px; background: #07090e; min-height: 100vh; padding-bottom: 90px; }

header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: rgba(7,9,14,0.9); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1rem; color: #fff; }
.sharingan-wrap { width: 40px; height: 40px; position: relative; display: flex; align-items: center; justify-content: center; }
.sharingan-glow { position: absolute; inset: -4px; background: radial-gradient(circle, rgba(220,38,38,0.6) 0%, transparent 70%); border-radius: 50%; animation: pulse 2s infinite; }
.sharingan-svg { width: 36px; height: 36px; animation: spin 6s linear infinite; filter: drop-shadow(0 0 8px rgba(220,38,38,0.9)); position: relative; z-index: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
.logo-text span { color: #38bdf8; }
.header-actions { display: flex; gap: 8px; }
.icon-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }

.search-panel { display: none; background: rgba(7,9,14,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(56,189,248,0.2); padding: 14px 16px; position: sticky; top: 67px; z-index: 99; max-height: 70vh; overflow-y: auto; }
.search-panel.open { display: block; }
.search-inner { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.search-input { flex: 1; background: #111827; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 11px 14px; border-radius: 10px; font-size: 0.82rem; outline: none; }
.search-results { display: flex; flex-direction: column; gap: 8px; }
.search-item { display: flex; gap: 12px; align-items: center; background: #111827; border: 1px solid rgba(255,255,255,0.06); padding: 10px; border-radius: 12px; cursor: pointer; }
.search-item img { width: 48px; height: 64px; border-radius: 8px; object-fit: cover; }
.search-item-title { font-size: 0.85rem; font-weight: 800; }
.search-item-meta { font-size: 0.68rem; color: #94a3b8; }
<style>
.hero { position: relative; min-height: 460px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; padding: 0 18px 20px; }
.hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,9,14,0.1) 0%, rgba(7,9,14,0.5) 45%, rgba(7,9,14,0.95) 75%, #07090e 100%); }
.hero-content { position: relative; z-index: 2; }
.hero-tag { color: #38bdf8; font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.hero-tag::before { content: ''; width: 18px; height: 2px; background: #38bdf8; }
.hero-title { font-size: 2rem; font-weight: 900; line-height: 1.05; margin-bottom: 10px; }
.hero-title span { color: #38bdf8; }
.hero-desc { font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 14px; }
.hero-meta { display: flex; gap: 10px; font-size: 0.72rem; color: #94a3b8; margin-bottom: 18px; flex-wrap: wrap; }
.star-val { color: #ffca28; font-weight: 800; }
.age-box { border: 1px solid rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 5px; font-size: 0.65rem; }
.hero-actions { display: flex; gap: 10px; }
.btn-watch-main { background: #38bdf8; color: #07090e; border: none; padding: 13px 16px; border-radius: 12px; font-weight: 900; font-size: 0.82rem; flex: 1; cursor: pointer; }
.btn-details-main { background: rgba(15,23,42,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 13px 16px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; flex: 1; cursor: pointer; }
.slider-bars { display: flex; gap: 6px; margin-top: 18px; position: relative; z-index: 2; }
.s-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.2); flex: 1; cursor: pointer; }
.s-bar.active { background: #38bdf8; }

.section { padding: 22px 0 8px; }
.sec-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; padding: 0 18px; }
.sec-title { font-size: 1.3rem; font-weight: 900; }
.sec-title span { color: #38bdf8; }
.see-all { color: #38bdf8; font-size: 0.72rem; font-weight: 800; background: none; border: none; cursor: pointer; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 18px; }
.card { background: rgba(15,23,42,0.4); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden; cursor: pointer; }
.poster-box { position: relative; width: 100%; aspect-ratio: 3/4; background: #1a2332; overflow: hidden; }
.poster-box img { width: 100%; height: 100%; object-fit: cover; }
.trending-tag { position: absolute; top: 10px; left: 10px; background: #38bdf8; color: #07090e; font-size: 0.55rem; font-weight: 900; padding: 3px 8px; border-radius: 5px; }
.new-tag { position: absolute; top: 10px; left: 10px; background: linear-gradient(135deg, #ec4899, #f43f5e); color: #fff; font-size: 0.55rem; font-weight: 900; padding: 3px 8px; border-radius: 5px; }
.ep-update-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(7,9,14,0.85); backdrop-filter: blur(10px); color: #fff; font-size: 0.58rem; font-weight: 800; padding: 4px 9px; border-radius: 6px; border: 1px solid rgba(56,189,248,0.5); }
.ep-update-badge::before { content: '🔥 '; }
.heart-icon { position: absolute; top: 10px; right: 10px; background: rgba(7,9,14,0.7); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.heart-icon.active { color: #ec4899; }
.card-body { padding: 12px; }
.card-title { font-size: 0.92rem; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 0.7rem; color: #64748b; margin-bottom: 10px; display: flex; justify-content: space-between; }
.card-rating { color: #ffca28; font-weight: 800; }
.btn-watch-card { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.35); color: #38bdf8; text-align: center; padding: 9px; border-radius: 9px; font-size: 0.75rem; font-weight: 800; width: 100%; cursor: pointer; }

.pagination { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 20px 18px; flex-wrap: wrap; }
.page-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; min-width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
.page-btn.active { background: #38bdf8; color: #07090e; border-color: #38bdf8; }
</style>
</head>
  <body>
<div class="app-shell">

    <header>
        <a href="index.html" class="logo">
            <div class="sharingan-wrap">
                <div class="sharingan-glow"></div>
                <svg class="sharingan-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7f1d1d"/>
                            <stop offset="60%" stop-color="#b91c1c"/>
                            <stop offset="100%" stop-color="#450a0a"/>
                        </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="48" fill="url(#eyeGrad)" stroke="#000" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="22" fill="none" stroke="#000" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="8" fill="#000"/>
                    <g fill="#000">
                        <path d="M 50 28 C 38 12, 20 26, 34 42 C 40 46, 48 40, 50 28 Z" transform="rotate(0 50 50)"/>
                        <path d="M 50 28 C 38 12, 20 26, 34 42 C 40 46, 48 40, 50 28 Z" transform="rotate(120 50 50)"/>
                        <path d="M 50 28 C 38 12, 20 26, 34 42 C 40 46, 48 40, 50 28 Z" transform="rotate(240 50 50)"/>
                    </g>
                </svg>
            </div>
            <div class="logo-text">Great.<span>Anime</span> Zone</div>
        </a>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleSearch()">🔍</button>
            <button class="icon-btn">☰</button>
        </div>
    </header>

    <div class="search-panel" id="searchPanel">
        <div class="search-inner">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search anime..." oninput="doSearch(this.value)">
            <button class="icon-btn" onclick="toggleSearch()">✕</button>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div class="hero" id="heroBanner">
        <div class="hero-content">
            <div class="hero-tag" id="hTag">FEATURED</div>
            <h1 class="hero-title" id="hTitle">Loading...</h1>
            <p class="hero-desc" id="hDesc">Loading...</p>
            <div class="hero-meta">
                <span class="star-val">★ <span id="hRating">0</span></span>
                <span>•</span>
                <span id="hEps">0</span>
                <span>•</span>
                <span class="age-box" id="hAge">16+</span>
            </div>
            <div class="hero-actions">
                <button class="btn-watch-main" id="heroWatchBtn">▶ Watch now</button>
                <button class="btn-details-main" id="heroDetailsBtn">View details</button>
            </div>
        </div>
        <div class="slider-bars" id="sliderDots"></div>
    </div>

    <div class="section">
        <div class="sec-header">
            <div class="sec-title">🔥 Latest <span>Updates</span></div>
            <button class="see-all" onclick="filterCategory('All', 1)">See All →</button>
        </div>
        <div class="grid-2" id="latestGrid"></div>
    </div>

    <div class="section">
        <div class="sec-header">
            <div class="sec-title">⚔️ Action <span>Picks</span></div>
            <button class="see-all" onclick="filterCategory('Action', 1)">See All →</button>
        </div>
        <div class="grid-2" id="actionGrid"></div>
    </div>

    <div class="section">
        <div class="sec-header">
            <div class="sec-title">🌍 Adventure <span>World</span></div>
            <button class="see-all" onclick="filterCategory('Adventure', 1)">See All →</button>
        </div>
        <div class="grid-2" id="adventureGrid"></div>
    </div>

    <div class="section">
        <div class="sec-header">
            <div class="sec-title">✨ Fantasy <span>Realm</span></div>
            <button class="see-all" onclick="filterCategory('Fantasy', 1)">See All →</button>
        </div>
        <div class="grid-2" id="fantasyGrid"></div>
    </div>

    <div class="section">
        <div class="sec-header">
            <div class="sec-title">📺 All <span>Anime</span></div>
        </div>
        <div class="grid-2" id="allGrid"></div>
        <div class="pagination" id="pagination"></div>
    </div>

</div>

<script src="animeData.js"></script>
<script>
const PER_PAGE = 25;
let currentPage = 1;
let currentCategory = 'All';

let currentHeroIndex = 0;
let heroTimer = null;

function initHero() {
    if (typeof heroSlides === 'undefined') return;
    document.getElementById('sliderDots').innerHTML = heroSlides.map((_, i) => 
        `<div class="s-bar ${i === 0 ? 'active' : ''}" onclick="setHero(${i})"></div>`
    ).join('');
    updateHero();
    heroTimer = setInterval(() => {
        currentHeroIndex = (currentHeroIndex + 1) % heroSlides.length;
        updateHero();
    }, 5000);
}

function setHero(i) { currentHeroIndex = i; updateHero(); }

function updateHero() {
    const d = heroSlides[currentHeroIndex];
    document.getElementById('heroBanner').style.backgroundImage = `url('${d.bg}')`;
    document.getElementById('hTag').innerText = d.tag;
    const words = d.title.split(' ');
    document.getElementById('hTitle').innerHTML = `${words[0]} <span>${words.slice(1).join(' ')}</span>`;
    document.getElementById('hDesc').innerText = d.desc;
    document.getElementById('hRating').innerText = d.rating;
    document.getElementById('hEps').innerText = d.eps;
    document.getElementById('hAge').innerText = d.age;
    document.getElementById('heroWatchBtn').onclick = () => goWatch(d.id);
    document.getElementById('heroDetailsBtn').onclick = () => goWatch(d.id);
    document.querySelectorAll('.s-bar').forEach((b, i) => 
        b.className = `s-bar ${i === currentHeroIndex ? 'active' : ''}`
    );
}

function buildCard(a) {
    return `
        <div class="card" onclick="goWatch(${a.id})">
            <div class="poster-box">
                <img src="${a.img}" alt="${a.name}" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:3rem;font-weight:900;color:#38bdf8;\\'>${a.name.charAt(0)}</div>'">
                ${a.isNew ? '<div class="new-tag">NEW</div>' : (a.isTrending ? '<div class="trending-tag">TRENDING</div>' : '')}
                ${a.latestUpdate ? `<div class="ep-update-badge">${a.latestUpdate}</div>` : ''}
                <div class="heart-icon" onclick="event.stopPropagation(); toggleHeart(this)">♡</div>
            </div>
            <div class="card-body">
                <div class="card-title">${a.name}</div>
                <div class="card-meta">
                    <span>${a.year || '2024'} • ${a.eps || '?'} eps</span>
                    <span class="card-rating">★ ${a.rating}</span>
                </div>
                <button class="btn-watch-card" onclick="event.stopPropagation(); goWatch(${a.id})">Watch now</button>
            </div>
        </div>
    `;
}

function sortLatestFirst(arr) {
    return [...arr].sort((a, b) => {
        const dateA = new Date(a.addedDate || '2020-01-01');
        const dateB = new Date(b.addedDate || '2020-01-01');
        return dateB - dateA;
    });
}

function renderRows() {
    if (typeof animeDatabase === 'undefined') return;
    const sorted = sortLatestFirst(animeDatabase);
    
    document.getElementById('latestGrid').innerHTML = sorted.slice(0, 6).map(buildCard).join('');
    document.getElementById('actionGrid').innerHTML = sorted.filter(a => a.genres && a.genres.includes('Action')).slice(0, 4).map(buildCard).join('');
    document.getElementById('adventureGrid').innerHTML = sorted.filter(a => a.genres && a.genres.includes('Adventure')).slice(0, 4).map(buildCard).join('');
    document.getElementById('fantasyGrid').innerHTML = sorted.filter(a => a.genres && a.genres.includes('Fantasy')).slice(0, 4).map(buildCard).join('');
    
    renderAllAnime(currentPage);
}

function renderAllAnime(page) {
    const sorted = sortLatestFirst(animeDatabase);
    const filtered = currentCategory === 'All' ? sorted : sorted.filter(a => a.genres && a.genres.includes(currentCategory));
    
    const totalPages = Math.ceil(filtered.length / PER_PAGE);
    const start = (page - 1) * PER_PAGE;
    const pageItems = filtered.slice(start, start + PER_PAGE);
    
    document.getElementById('allGrid').innerHTML = pageItems.map(buildCard).join('');
    renderPagination(totalPages, page);
}

function renderPagination(totalPages, currentPage) {
    const box = document.getElementById('pagination');
    if (totalPages <= 1) { box.innerHTML = ''; return; }
    
    let html = '';
    if (currentPage > 1) html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})">‹</button>`;
    
    let startPage = Math.max(1, currentPage - 3);
    let endPage = Math.min(totalPages, startPage + 6);
    if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }
    
    if (currentPage < totalPages) html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})">›</button>`;
    
    box.innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    renderAllAnime(page);
    document.getElementById('allGrid').scrollIntoView({ behavior: 'smooth' });
}

function filterCategory(cat, page = 1) {
    currentCategory = cat;
    currentPage = page;
    renderAllAnime(page);
    document.getElementById('allGrid').scrollIntoView({ behavior: 'smooth' });
}

function goWatch(id) { window.location.href = `watch.html?id=${id}`; }

function toggleHeart(el) {
    el.classList.toggle('active');
    el.innerText = el.classList.contains('active') ? '♥' : '♡';
}

let searchTimer = null;

function toggleSearch() {
    const panel = document.getElementById('searchPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) setTimeout(() => document.getElementById('searchInput').focus(), 100);
}

function doSearch(query) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        const results = document.getElementById('searchResults');
        const q = query.trim().toLowerCase();
        if (!q) { results.innerHTML = ''; return; }
        
        const found = animeDatabase.filter(a => a.name.toLowerCase().includes(q));
        if (found.length === 0) {
            results.innerHTML = `<div style="text-align:center;color:#64748b;padding:20px;">❌ No anime found</div>`;
            return;
        }
        
        results.innerHTML = found.map(a => `
            <div class="search-item" onclick="location.href='watch.html?id=${a.id}'">
                <img src="${a.img}" alt="${a.name}" onerror="this.style.display='none'">
                <div>
                    <div class="search-item-title">${a.name}</div>
                    <div class="search-item-meta">★ ${a.rating} • ${a.year || '2024'} • ${a.eps || '?'} eps</div>
                </div>
            </div>
        `).join('');
    }, 200);
}

initHero();
renderRows();
</script>
</body>
</html>
