<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime — Great.Anime Zone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #07090e; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        .app-shell { width: 100%; max-width: 420px; background: #07090e; min-height: 100vh; display: flex; flex-direction: column; position: relative; border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }

        .watch-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #07090e; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 50; }
        .back-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; }
        
        .sharingan-box { width: 30px; height: 30px; background: #991b1b; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(239, 68, 68, 0.8); border: 1px solid rgba(248, 113, 113, 0.5); overflow: hidden; }
        .sharingan-svg { width: 22px; height: 22px; animation: spinEye 4s linear infinite; }
        @keyframes spinEye { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .player-wrapper { position: relative; width: 100%; background: #000000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .video-box { width: 100%; height: 235px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .video-box video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        
        .rotate-btn { position: absolute; bottom: 12px; right: 12px; background: rgba(11, 15, 25, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 8px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(4px); z-index: 10; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(0, 0, 0, 0.5); }
        .rotate-btn:active { background: #38bdf8; color: #07090e; }

        .watch-details-box { padding: 16px 14px; }
        .w-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
        .w-meta { display: flex; gap: 8px; align-items: center; font-size: 0.72rem; color: #94a3b8; margin-bottom: 12px; }
        .w-badge { background: #38bdf8; color: #07090e; font-size: 0.58rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .w-desc { font-size: 0.74rem; color: #a0aec0; line-height: 1.45; margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }

        .season-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ep-section-title { font-size: 0.9rem; font-weight: 800; }
        .season-selector { background: #1e293b; color: #ffffff; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; outline: none; cursor: pointer; }

        .zip-box { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .btn-zip { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 10px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .ep-grid-page { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .ep-card-btn { background: #111827; border: 1px solid rgba(255,255,255,0.06); padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .ep-card-btn.active { border-left: 4px solid #38bdf8; background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, rgba(17, 24, 39, 0.5) 100%); border-color: rgba(56, 189, 248, 0.2); }
        .ep-info-box { display: flex; flex-direction: column; flex: 1; overflow: hidden; padding-right: 12px; }
        .ep-num { font-size: 0.65rem; color: #38bdf8; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .ep-new-inline { background: #ef4444; color: #fff; font-size: 0.5rem; padding: 2px 5px; border-radius: 4px; }
        .ep-name { font-size: 0.8rem; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .playing-icon { display: none; color: #38bdf8; }
        .ep-card-btn.active .playing-icon { display: block; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="watch-header">
            <a href="index.html" class="back-btn">← Back</a>
            <div class="sharingan-box">
                <svg class="sharingan-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#dc2626" stroke="#000" stroke-width="3"/>
                    <circle cx="50" cy="50" r="26" fill="none" stroke="#000" stroke-width="3"/>
                    <circle cx="50" cy="50" r="9" fill="#000"/>
                    <path d="M 50 38 C 36 18, 22 32, 38 48 C 22 38, 36 18, 50 38 Z" fill="#000" transform="rotate(0 50 50)"/>
                    <path d="M 50 38 C 36 18, 22 32, 38 48 C 22 38, 36 18, 50 38 Z" fill="#000" transform="rotate(120 50 50)"/>
                    <path d="M 50 38 C 36 18, 22 32, 38 48 C 22 38, 36 18, 50 38 Z" fill="#000" transform="rotate(240 50 50)"/>
                </svg>
            </div>
        </div>

        <div class="player-wrapper">
            <div class="video-box" id="playerFrame"></div>
            <button class="rotate-btn" onclick="toggleFullScreen()" title="Fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>

        <div class="watch-details-box">
            <h1 class="w-title" id="wTitle">Loading...</h1>
            <div class="w-meta">
                <span class="w-badge" id="wLang">Hindi Dubbed</span>
                <span style="color: #ffca28; font-weight: 700;">★ <span id="wRating">8.5</span></span>
                <span>•</span>
                <span id="epCountText" style="color: #cbd5e1;">0 Episodes</span>
            </div>
            
            <p class="w-desc" id="wDesc">Loading description...</p>

            <div class="season-header-box" id="seasonHeaderBox" style="display: none;">
                <div class="ep-section-title">Episodes List</div>
                <select id="seasonSelectDropdown" class="season-selector" onchange="handleSeasonChange(this.value)"></select>
            </div>

            <div id="zipDownloadContainer" class="zip-box" style="display: none;"></div>

            <div class="ep-grid-page" id="wEpGrid"></div>
        </div>
    </div>

    <script src="animeData.js"></script>
        <script>
        let currentAnime = null;
        let currentSeasonKey = null;
        let currentEpisodesList = [];

        const urlParams = new URLSearchParams(window.location.search);
        const animeKey = urlParams.get('name') || urlParams.get('id');

        let db = typeof animeDatabase !== 'undefined' ? animeDatabase : null;

        if (db) {
            if (Array.isArray(db)) {
                currentAnime = db.find(a => (a.name && animeKey && a.name.toLowerCase() === animeKey.toLowerCase()) || a.id == animeKey) || db[0];
            } else {
                let keys = Object.keys(db);
                let matchedKey = keys.find(k => animeKey && k.toLowerCase() === animeKey.toLowerCase()) || keys[0];
                currentAnime = db[matchedKey];
            }

            if (currentAnime) {
                document.getElementById('wTitle').innerText = currentAnime.title || currentAnime.name || "Anime";
                document.getElementById('wRating').innerText = currentAnime.rating || "8.5";
                document.getElementById('wLang').innerText = currentAnime.lang || currentAnime.sub || "Hindi Dubbed";
                document.getElementById('wDesc').innerText = currentAnime.desc || "";

                if (currentAnime.seasons && Object.keys(currentAnime.seasons).length > 0) {
                    currentSeasonKey = Object.keys(currentAnime.seasons)[0];
                    renderSeasonDropdown();
                    renderEpisodes(currentSeasonKey);
                }
            }
        } else {
            document.getElementById('wTitle').innerText = "Database Error!";
            document.getElementById('wDesc').innerText = "animeData.js could not be loaded.";
        }

        function renderSeasonDropdown() {
            const keys = Object.keys(currentAnime.seasons || {});
            const headerBox = document.getElementById('seasonHeaderBox');
            const dropdown = document.getElementById('seasonSelectDropdown');
            
            if (keys.length > 1) {
                headerBox.style.display = 'flex';
                dropdown.innerHTML = keys.map(key => {
                    const s = currentAnime.seasons[key];
                    return `<option value="${key}" ${key === currentSeasonKey ? 'selected' : ''}>${s.seasonName}</option>`;
                }).join('');
            } else {
                headerBox.style.display = 'none';
            }
        }

        function handleSeasonChange(key) {
            currentSeasonKey = key;
            renderEpisodes(key);
        }

        function renderEpisodes(seasonKey) {
            const seasonData = currentAnime.seasons[seasonKey];
            currentEpisodesList = seasonData.episodes || [];
            
            const zipContainer = document.getElementById('zipDownloadContainer');
            if (seasonData.seasonZip) {
                zipContainer.style.display = 'flex';
                if (Array.isArray(seasonData.seasonZip)) {
                    zipContainer.innerHTML = seasonData.seasonZip.map(z => `<a href="${z.link}" class="btn-zip" target="_blank">${z.name}</a>`).join('');
                } else {
                    zipContainer.innerHTML = `<a href="${seasonData.seasonZip}" class="btn-zip" target="_blank">📥 Download ${seasonData.seasonName} Zip</a>`;
                }
            } else {
                zipContainer.style.display = 'none';
            }

            document.getElementById('epCountText').innerText = `${currentEpisodesList.length} Episodes`;
            
            const epGrid = document.getElementById('wEpGrid');
            if (currentEpisodesList.length > 0) {
                epGrid.innerHTML = currentEpisodesList.map((e, index) => `
                    <div class="ep-card-btn" id="ep-card-${index}">
                        <div class="ep-info-box" onclick="playEp(${index}, document.getElementById('ep-card-${index}'))" style="cursor: pointer;">
                            <div class="ep-num">
                                EPISODE ${e.ep}
                                ${e.isNewEp ? '<span class="ep-new-inline">NEW</span>' : ''}
                            </div>
                            <div class="ep-name">${e.title}</div>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 8px;">
                            ${e.download ? `
                                <a href="${e.download}" target="_blank" title="Download Episode" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 6px 10px; border-radius: 8px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s;">
                                    📥
                                </a>
                            ` : ''}
                            
                            <div onclick="playEp(${index}, document.getElementById('ep-card-${index}'))" style="cursor: pointer; display: flex; align-items: center; padding: 6px;">
                                <svg class="playing-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="6" y="5" width="4" height="14" rx="1"/>
                                    <rect x="14" y="5" width="4" height="14" rx="1"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                const firstCard = epGrid.querySelector('.ep-card-btn');
                playEp(0, firstCard);
            } else {
                epGrid.innerHTML = '<div style="color: #94a3b8; font-size: 0.8rem; text-align: center; padding: 20px;">Episodes coming soon...</div>';
            }
        }

        // ============================================
        // MULTI-API FALLBACK FUNCTIONS
        // ============================================

        async function fetchFromHiAnime(animeName, epNum) {
    try {
        const res = await fetch(`https://great-anime-zone.bhandaridharmveer529.workers.dev/?anime=${encodeURIComponent(animeName)}&ep=${epNum}&type=dub`);
        const data = await res.json();
        
        if (data.sources && data.sources.length > 0) {
            return data.sources[0].url;
        }
        return null;
    } catch (e) {
        console.log('Cloudflare Worker fail:', e);
        return null;
    }
        }

        async function fetchFromConsumet(animeName, epNum) {
            try {
                const searchRes = await fetch(`https://api.consumet.org/anime/gogoanime/${encodeURIComponent(animeName)}`);
                const searchData = await searchRes.json();
                if (!searchData.results || searchData.results.length === 0) return null;
                
                const animeId = searchData.results[0].id;
                const infoRes = await fetch(`https://api.consumet.org/anime/gogoanime/info/${animeId}`);
                const infoData = await infoRes.json();
                if (!infoData.episodes || !infoData.episodes[epNum - 1]) return null;
                
                const epId = infoData.episodes[epNum - 1].id;
                const watchRes = await fetch(`https://api.consumet.org/anime/gogoanime/watch/${epId}`);
                const watchData = await watchRes.json();
                
                if (watchData.sources && watchData.sources.length > 0) {
                    return watchData.sources[0].url;
                }
                return null;
            } catch (e) {
                console.log('Consumet API fail:', e);
                return null;
            }
        }

        async function fetchFromAnify(animeName, epNum) {
            try {
                const searchRes = await fetch(`https://api.anify.tv/search?query=${encodeURIComponent(animeName)}`);
                const searchData = await searchRes.json();
                if (!searchData.results || searchData.results.length === 0) return null;
                
                const animeId = searchData.results[0].id;
                const epRes = await fetch(`https://api.anify.tv/episodes/${animeId}`);
                const epData = await epRes.json();
                if (!epData.episodes || !epData.episodes[epNum - 1]) return null;
                
                const epId = epData.episodes[epNum - 1].id;
                const streamRes = await fetch(`https://api.anify.tv/sources/${epId}`);
                const streamData = await streamRes.json();
                
                if (streamData.sources && streamData.sources.length > 0) {
                    return streamData.sources[0].url;
                }
                return null;
            } catch (e) {
                console.log('Anify API fail:', e);
                return null;
            }
        }

        function loadVideo(container, link) {
            if (link.includes('streamtape.com/e/')) {
                const match = link.match(/(https:\/\/streamtape\.com\/e\/[A-Za-z0-9]+)/);
                if (match) link = match[1] + '/';
            }
            
            if (link.endsWith('.mp4') || link.includes('.mkv')) {
                container.innerHTML = `<video src="${link}" controls autoplay playsinline controlsList="nodownload"></video>`;
            } else if (link.includes('.m3u8')) {
                container.innerHTML = `<video id="hlsVideo" controls autoplay playsinline style="width:100%;height:100%;"></video>`;
                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    const video = document.getElementById('hlsVideo');
                    const hls = new Hls();
                    hls.loadSource(link);
                    hls.attachMedia(video);
                } else {
                    container.innerHTML = `<video src="${link}" controls autoplay playsinline></video>`;
                }
            } else {
                container.innerHTML = `<iframe src="${link}" allowfullscreen allow="autoplay"></iframe>`;
            }
        }

        async function playEp(index, element) {
            const epData = currentEpisodesList[index];
            if (!epData) return;

            document.querySelectorAll('.ep-card-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');

            const container = document.getElementById('playerFrame');
            let link = epData.watch || epData.link || '';
            
            if (link && link !== '#' && link !== '') {
                loadVideo(container, link);
                return;
            }
            
            container.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#38bdf8;gap:10px;">
                    <div style="font-size:1.5rem;">🔄</div>
                    <div style="font-size:0.8rem;font-weight:700;">Video dhoondh rahe hain...</div>
                    <div style="font-size:0.7rem;color:#94a3b8;" id="apiStatus">HiAnime API try kar rahe hain...</div>
                </div>
            `;
            
            const animeName = currentAnime.name || currentAnime.title;
            const epNum = typeof epData.ep === 'number' ? epData.ep : index + 1;
            const statusEl = document.getElementById('apiStatus');
            
            if (statusEl) statusEl.innerText = 'HiAnime API try kar rahe hain...';
            link = await fetchFromHiAnime(animeName, epNum);
            if (link) { loadVideo(container, link); return; }
            
            if (statusEl) statusEl.innerText = 'Consumet API try kar rahe hain...';
            link = await fetchFromConsumet(animeName, epNum);
            if (link) { loadVideo(container, link); return; }
            
            if (statusEl) statusEl.innerText = 'Anify API try kar rahe hain...';
            link = await fetchFromAnify(animeName, epNum);
            if (link) { loadVideo(container, link); return; }
            
            container.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#94a3b8;gap:10px;">
                    <div style="font-size:2rem;">⚠️</div>
                    <div style="font-size:0.85rem;font-weight:700;">Video Not Available</div>
                    <div style="font-size:0.7rem;">Saare sources fail ho gaye</div>
                </div>
            `;
        }

        async function toggleFullScreen() {
            const container = document.getElementById('playerFrame');
            const targetElement = container.querySelector('video') || container.querySelector('iframe') || container;
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (targetElement.requestFullscreen) {
                        await targetElement.requestFullscreen();
                    } else if (targetElement.webkitRequestFullscreen) {
                        await targetElement.webkitRequestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {
                console.log("Fullscreen/Auto-rotate restriction:", err);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.14/dist/hls.js"></script>
</body>
</html>
